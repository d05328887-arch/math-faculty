["1955","Кафедра математики разделена на кафедры высшей и элементарной математики."],
["1972","Физико-математический факультет разделён на факультеты физики и математики."],
["1975","Образованы кафедры анализа и теории функций, алгебры и теории чисел, геометрии. До 1991 года действовали четыре кафедры."],
["1991","Создана кафедра информатики и вычислительной математики."],
["1992","С преобразованием института в университет созданы кафедры дифференциальных уравнений и функционального анализа, высшей и практической математики."],
["2018","Кафедре анализа присвоено имя профессора А. Мухсинова, его кабинет стал музеем. К. Тухлиев защитил докторскую диссертацию."]],
ac:["Сегодня на факультете учатся более 1700 студентов дневного и заочного отделений, магистратуры и PhD; обучение ведётся по специальностям: математика, практическая математика, информатика, математика-физика.",
"Студенты побеждают на республиканских и общероссийских олимпиадах по математике и информационным технологиям, получают стипендии председателя города, области и республики.",
"Преподаватели выпустили учебники для школ и вузов: «Информационная технология», «Анализ математики», «Аналитическая геометрия», «Теория чисел» и др.",
"Сотрудничество с МГУ имени М.В. Ломоносова, Воронежским государственным университетом, ТНУ, Институтом математики АН РТ и другими центрами науки.",

d:[["Кафедраи МТМ ва ТИ","Методикаи таълими математика ва технологияи иттилоотӣ","Тайёр кардани омӯзгорони математика ва информатика, рушди методикаи таълими математика ва технологияи иттилоотӣ."],
["Кафедраи таҳлили математикӣ ба номи профессор А. Муҳсинов","Таҳлили математикӣ ва назарияи функсияҳо","Таҳлили математикӣ, назарияи функсияҳо, муодилаҳои дифференсиалӣ. Кафедра ба номи профессор А. Муҳсинов гузошта шудааст, кабинети ӯ ба осорхона табдил ёфтааст."],
["Кафедраи информатика ва МҲ","Информатика ва математикаи ҳисоббарорӣ","Информатика, барномасозӣ ва математикаи ҳисоббарорӣ. Кафедра соли 1991 таъсис ёфтааст."],
["Кафедраи математикаи олӣ ва амалӣ","Математикаи олӣ ва амалӣ","Кафедра аз соли 1992 фаъолият дорад ва аз соли 2011 номи кунунӣ дорад."],
["Кафедраи алгебра ва геометрия","Алгебра, назарияи ададҳо ва геометрия","Алгебра, назарияи ададҳо ва геометрия. Кафедра соли 1975 таъсис ёфтааст ва кунун алгебра ва геометрияро муттаҳид мекунад."]],
tl:[["1932","Факулта якҷоя бо донишгоҳ таъсис ёфт. Дар соли аввал 12 донишҷӯ таҳсил мекард, соли 1936 ҳафт нафари онҳо дипломи омӯзгорӣ гирифтанд."],
["1938","Вазифаи декан пайдо шуд (қаблан факултаро директор роҳбарӣ мекард). Аввалин декан — М. Акрамов."],
["1955","Кафедраи математика ба кафедраҳои математикаи олӣ ва элементарӣ ҷудо шуд."],
["1972","Факултаи физика-математика ба факултаҳои физика ва математика ҷудо шуд."],
["1975","Кафедраҳои таҳлил ва назарияи функсияҳо, алгебра ва назарияи ададҳо, геометрия таъсис ёфтанд. То соли 1991 чор кафедра фаъолият дошт."],
["1991","Кафедраи информатика ва математикаи ҳисоббарорӣ таъсис ёфт."],
["1992","Бо табдили институт ба донишгоҳ кафедраҳои муодилаҳои дифференсиалӣ ва таҳлили функсионалӣ, математикаи олӣ ва амалӣ ташкил шуданд."],
["2018","Кафедраи таҳлил ба номи профессор А. Муҳсинов гузошта шуд, кабинети ӯ осорхона гашт. Қ. Тухлиев рисолаи докторӣ ҳимоя кард."]],
ac:["Имрӯз дар факулта беш аз 1700 донишҷӯи шӯъбаи рӯзона ва ғоибона, магистратура ва PhD таҳсил мекунад: математика, математикаи амалӣ, информатика, математика-физика.",
"Донишҷӯён дар олимпиадаҳои ҷумҳуриявӣ ва умумирусӣ аз математика ва технологияи иттилоотӣ ғолиб меоянд, стипендияҳои раиси шаҳр, вилоят ва ҷумҳурӣ мегиранд.",
"Омӯзгорон китобҳои дарсӣ барои мактабҳо ва донишгоҳҳо нашр кардаанд: «Технологияи иттилоотӣ», «Таҳлили математикӣ», «Геометрияи аналитикӣ», «Назарияи ададҳо» ва ғ.",
"Ҳамкорӣ бо ДДМ ба номи М.В. Ломоносов, Донишгоҳи давлатии Воронеж, ДМТ, Институти математикаи АИ ҶТ ва дигар марказҳои илмӣ.",
"Заминаи моддӣ: 4 синфхонаи компютерӣ, 5 кабинети фаннӣ, 12 тахтаи электронӣ, 20 проектор, тақрибан 80 компютер."]}};
